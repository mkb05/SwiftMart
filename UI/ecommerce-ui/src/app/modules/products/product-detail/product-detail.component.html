<div class="container mt-4">
  <div class="row">
    <div class="col-md-6">
      <img
        src="https://i.imgur.com/8JIWpnw.jpg"
        class="img-fluid rounded"
        alt="Product Image"
      />
    </div>

    <div class="col-md-6">
      <h2>{{ product.name }}</h2>

      <p class="text-muted">
        {{ product.description }}
      </p>

      <h4 class="text-success">₹ {{ product.price }}</h4>

      <div class="mt-3">
        <button class="btn btn-primary me-2">Add to Cart</button>

        <button class="btn btn-outline-secondary">Buy Now</button>
      </div>

      <div class="mt-4">
        <span class="badge bg-success">4.8 ★</span>
        <span class="ms-2">In Stock</span>
      </div>
    </div>
  </div>
</div>
