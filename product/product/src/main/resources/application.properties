spring.application.name=product
server.port=8082

spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_products
spring.datasource.username=root
spring.datasource.password=manojkumar
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter=DEBUG

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms


# Elasticsearch connection
spring.elasticsearch.uris=http://localhost:9200

# Optional but recommended
spring.elasticsearch.connection-timeout=5s
spring.elasticsearch.socket-timeout=10s
